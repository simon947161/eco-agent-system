name: Deploy CCZPS-Lite Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh generated scenario outputs
        run: |
          python cczps_lite/engine/scenario_compare.py
          python cczps_lite/engine/meteorology_runtime.py
          python cczps_lite/engine/usage_cost_governance.py
          python cczps_lite/engine/budget_guard.py
          python cczps_lite/engine/location_intake.py
          python cczps_lite/engine/planning_hypothesis.py
          python cczps_lite/engine/validation_support.py
          python cczps_lite/engine/evidence_traceability.py
          python cczps_lite/engine/governance_decision_support.py
          python cczps_lite/engine/scenario_comparison.py
      - name: Stage dashboard site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -R cczps_lite/dashboard/. _site/
          cp cczps_lite/output/comparison_matrix.csv _site/data/comparison_matrix.csv
          cp cczps_lite/output/meteorology_evidence.json _site/data/meteorology_evidence.json
          cp cczps_lite/output/meteorology_trends.json _site/data/meteorology_trends.json
          cp cczps_lite/output/planning_hypotheses.json _site/data/planning_hypotheses.json
          cp cczps_lite/output/location_intake_profiles.json _site/data/location_intake_profiles.json
          cp cczps_lite/output/evidence_traceability.json _site/data/evidence_traceability.json
          cp cczps_lite/output/governance_decision_records.json _site/data/governance_decision_records.json
          cp cczps_lite/output/scenario_comparison.json _site/data/scenario_comparison.json
          cp cczps_lite/output/planning_approval_support_report.json _site/data/planning_approval_support_report.json
          cp cczps_lite/output/spatial_transect_scenario_pack.json _site/data/spatial_transect_scenario_pack.json
          cp docs/CCZPS_LITE_SYSTEM_VALIDATION_REPORT.md _site/data/system_validation_report.md
          cp cczps_lite/output/runtime_capability_map.md _site/data/runtime_capability_map.md
          sed -i 's#../output/comparison_matrix.csv#data/comparison_matrix.csv#' _site/dashboard.js
          sed -i 's#../output/comparison_matrix.csv#data/comparison_matrix.csv#' _site/usage-cost-dashboard.js
          sed -i 's#../output/comparison_matrix.csv#data/comparison_matrix.csv#' _site/budget-guard-dashboard.js
          sed -i 's#../output/meteorology_evidence.json#data/meteorology_evidence.json#' _site/meteorology-dashboard.js
          sed -i 's#../output/meteorology_trends.json#data/meteorology_trends.json#' _site/meteorology-dashboard.js
          sed -i 's#../output/planning_hypotheses.json#data/planning_hypotheses.json#' _site/planning-hypothesis-dashboard.js
          sed -i 's#../output/location_intake_profiles.json#data/location_intake_profiles.json#' _site/location-intake-dashboard.js
          sed -i 's#../output/governance_decision_records.json#data/governance_decision_records.json#' _site/governance-decision-dashboard.js
          sed -i 's#../output/scenario_comparison.json#data/scenario_comparison.json#' _site/scenario-comparison-dashboard.js
          sed -i 's#../output/scenario_comparison.json#data/scenario_comparison.json#' _site/human-readable-dashboard.js
          sed -i 's#../output/evidence_traceability.json#data/evidence_traceability.json#' _site/human-readable-dashboard.js
          sed -i 's#../output/planning_hypotheses.json#data/planning_hypotheses.json#' _site/human-readable-dashboard.js
          sed -i 's#../output/governance_decision_records.json#data/governance_decision_records.json#' _site/human-readable-dashboard.js
          sed -i 's#../output/planning_approval_support_report.json#data/planning_approval_support_report.json#' _site/human-readable-dashboard.js
          sed -i 's#../output/spatial_transect_scenario_pack.json#data/spatial_transect_scenario_pack.json#' _site/human-readable-dashboard.js
          sed -i 's#../../docs/CCZPS_LITE_SYSTEM_VALIDATION_REPORT.md#data/system_validation_report.md#' _site/dashboard.js
          sed -i 's#../output/runtime_capability_map.md#data/runtime_capability_map.md#' _site/dashboard.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
