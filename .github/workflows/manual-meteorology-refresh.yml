name: Manual Meteorology Refresh

on:
  workflow_dispatch:
    inputs:
      observation_dates:
        description: "Comma-separated YYYYMMDD dates; leave blank to use range mode"
        required: false
        default: "20250501"
      start_date:
        description: "Range start in YYYYMMDD format; requires blank observation_dates"
        required: false
        default: ""
      end_date:
        description: "Range end in YYYYMMDD format; requires blank observation_dates"
        required: false
        default: ""
      interval_days:
        description: "Positive day interval for range mode"
        required: true
        default: "7"
      manual_approval:
        description: "Confirm manual approval for live NASA POWER request"
        required: true
        type: boolean
        default: false
      force_refresh:
        description: "Bypass cache and refetch NASA POWER data"
        required: true
        type: boolean
        default: false
      commit_outputs:
        description: "Commit refreshed output files back to repository"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate branch target
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Commit mode requires a branch ref, not $GITHUB_REF_TYPE."
            exit 1
          fi
          echo "Refresh target branch: $GITHUB_REF_NAME"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh NASA POWER meteorology evidence
        shell: bash
        env:
          OBSERVATION_DATES: ${{ inputs.observation_dates }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INTERVAL_DAYS: ${{ inputs.interval_days }}
          MANUAL_APPROVAL: ${{ inputs.manual_approval }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          if [[ "$MANUAL_APPROVAL" != "true" ]]; then
            echo "Manual approval must be explicitly granted for batch meteorology refresh."
            exit 1
          fi
          args=(--manual-approval)
          if [[ -n "$OBSERVATION_DATES" ]]; then
            args+=(--dates "$OBSERVATION_DATES")
          else
            args+=(--start-date "$START_DATE" --end-date "$END_DATE" --interval-days "$INTERVAL_DAYS")
          fi
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            args+=(--force-refresh)
          fi
          python cczps_lite/engine/meteorology_batch_runtime.py "${args[@]}"
      - name: Run unit tests
        run: python -m unittest discover
      - name: Commit refreshed outputs
        if: ${{ inputs.commit_outputs }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cczps_lite/output/meteorology_evidence.json
          git add cczps_lite/output/meteorology_cache.json
          git add cczps_lite/output/meteorology_timeseries.json
          git add cczps_lite/output/meteorology_trends.json
          git add cczps_lite/output/meteorology_trends.md
          staged_files="$(git diff --cached --name-only)"
          unexpected_files="$(printf '%s\n' "$staged_files" | grep -Ev '^(cczps_lite/output/meteorology_evidence\.json|cczps_lite/output/meteorology_cache\.json|cczps_lite/output/meteorology_timeseries\.json|cczps_lite/output/meteorology_trends\.json|cczps_lite/output/meteorology_trends\.md)$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to commit unexpected files:"
            echo "$unexpected_files"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No meteorology output changes to commit."
            exit 0
          fi
          git commit -m "Refresh batch meteorology evidence"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Upload refreshed outputs
        if: ${{ !inputs.commit_outputs }}
        uses: actions/upload-artifact@v4
        with:
          name: meteorology-refresh-output
          path: |
            cczps_lite/output/meteorology_evidence.json
            cczps_lite/output/meteorology_cache.json
            cczps_lite/output/meteorology_timeseries.json
            cczps_lite/output/meteorology_trends.json
            cczps_lite/output/meteorology_trends.md
