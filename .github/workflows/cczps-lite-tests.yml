name: CCZPS-Lite Tests

on:
  push:
    paths:
      - "cczps_lite/**"
      - "tests/**"
      - ".github/workflows/cczps-lite-tests.yml"
  pull_request:
    paths:
      - "cczps_lite/**"
      - "tests/**"
      - ".github/workflows/cczps-lite-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run CCZPS-Lite validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate input JSON files
        run: |
          python -m json.tool cczps_lite/input/location_profile.json >/dev/null
          python -m json.tool cczps_lite/input/evidence_profile.json >/dev/null
          python -m json.tool cczps_lite/input/scenario_options.json >/dev/null

      - name: Compile Python files
        run: |
          python -m compileall cczps_lite tests

      - name: Run CCZPS-Lite generator
        run: |
          python cczps_lite/engine/scenario_compare.py

      - name: Run regression tests
        run: |
          python -m unittest tests/test_cczps_lite.py
