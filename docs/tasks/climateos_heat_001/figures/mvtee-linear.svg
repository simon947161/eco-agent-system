<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">L　紧凑线性｜C 靠近 B，热端短接</title>
  <desc id="desc">概念平面图，两图的 A、B、受体、障碍位置一致。彩线为两条独立的保温供回管廊，封帽处不接新用户。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60777c"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007777"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ac5028"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#69528a"/></marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Noto Sans SC, sans-serif">
  <rect x="1" y="1" width="1118" height="518" rx="8" fill="#fafcf9" stroke="#cedad7" stroke-width="2"/>
  <text x="30" y="42" font-size="28" fill="#18353c" font-weight="700" text-anchor="start">L　紧凑线性｜C 靠近 B，热端短接</text>
  <text x="1090" y="40" font-size="17" fill="#007777" font-weight="700" text-anchor="end">CONCEPTUAL</text>
  <text x="30" y="74" font-size="18" fill="#45636a" font-weight="400" text-anchor="start">同一对 A、B 与同一组受体 · 无地理坐标，不按比例 · 彩线为单程路由，每段含供、回两根管。</text>
  <path d="M30 93 H1090" fill="none" stroke="#c8d7d1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="fixed-features">
    <rect x="32" y="108" width="1056" height="303" rx="6" fill="#f1f5ef" stroke="#d5dfd8" stroke-width="2"/>
    <rect x="242" y="122" width="227" height="43" rx="20" fill="#dcebf1" stroke="#80a6b2" stroke-width="2"/>
    <text x="356" y="150" font-size="18" fill="#315e6b" font-weight="600" text-anchor="middle">R水　低流量受纳水体</text>
    <rect x="712" y="174" width="167" height="74" rx="5" fill="#f0eae1" stroke="#b39c80" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="795" y="218" font-size="19" fill="#705d44" font-weight="600" text-anchor="middle">施工禁入区</text>
    <rect x="568" y="367" width="278" height="33" rx="15" fill="#e2eade" stroke="#9db18f" stroke-width="2"/>
    <text x="707" y="390" font-size="17" fill="#46613d" font-weight="600" text-anchor="middle">R人　下风人群 / 夜间</text>
  </g>
  <g id="corridors">
    <path d="M137 322 H660" fill="none" stroke="#007777" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M780 322 H961" fill="none" stroke="#ac5028" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M745 305 V265 H689" fill="none" stroke="#60777c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
    <path d="M689 258 V272" fill="none" stroke="#60777c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="586" y="272" font-size="17" fill="#45636a" font-weight="600" text-anchor="start">X 封帽</text>
    <text x="309" y="303" font-size="17" fill="#007777" font-weight="600" text-anchor="start">A–C  80 m</text>
    <text x="812" y="303" font-size="17" fill="#ac5028" font-weight="600" text-anchor="start">C–B  40 m</text>
  </g>
  <g id="objects">
    <rect x="61" y="294" width="94" height="56" rx="6" fill="#ffffff" stroke="#007777" stroke-width="2"/>
    <text x="108" y="329" font-size="21" fill="#007777" font-weight="700" text-anchor="middle">A  源</text>
    <rect x="956" y="294" width="107" height="56" rx="6" fill="#ffffff" stroke="#ac5028" stroke-width="2"/>
    <text x="1009" y="329" font-size="21" fill="#ac5028" font-weight="700" text-anchor="middle">B  需</text>
    <rect x="658" y="287" width="144" height="70" rx="6" fill="#ffffff" stroke="#18353c" stroke-width="2"/>
    <text x="730" y="315" font-size="21" fill="#18353c" font-weight="700" text-anchor="middle">C  热泵</text>
    <text x="730" y="340" font-size="18" fill="#45636a" font-weight="500" text-anchor="middle">＋ 水罐</text>
  </g>
  <text x="34" y="443" font-size="19" fill="#18353c" font-weight="600" text-anchor="start">相对标高 A 0 m　C +2 m　B +3 m。两段共用检修走廊，C–B 靠近人群缓冲带。</text>
  <text x="34" y="482" font-size="18" fill="#45636a" font-weight="400" text-anchor="start">A–B 直距假设 100 m，无 A–B 直连管。标高用于静压和排气检查；热损按各段实际敷设长度。</text>
  </g>
</svg>
