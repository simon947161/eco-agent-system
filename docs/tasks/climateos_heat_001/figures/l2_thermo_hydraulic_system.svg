<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" role="img" aria-labelledby="title desc">
<title id="title">HEAT-001 A–C–B L2 热工水力接口</title>
<desc id="desc">A为余热源，低温供回水对连接C热泵源侧；C热泵和可选水罐耦合负荷侧，高温供回水对连接B单一季节聚合需求。示意图为概念设计。</desc>
<style>text{font-family:Arial,sans-serif;fill:#18334d}.title{font-size:29px;font-weight:bold}.sub{font-size:16px;fill:#526b80}.source{fill:#fff4ee;stroke:#b85437;stroke-width:2}.plant{fill:#eef6fc;stroke:#3b78a2;stroke-width:2}.tank{fill:#fff8e8;stroke:#ba8120;stroke-width:2}.demand{fill:#eef8f2;stroke:#448059;stroke-width:2}.supply{stroke:#bb4e3d;stroke-width:7;fill:none}.ret{stroke:#397aae;stroke-width:7;stroke-dasharray:13 8;fill:none}.label{font-size:19px;font-weight:bold}.small{font-size:15px}</style>
<rect width="1300" height="800" fill="#fcfdff"/><text x="45" y="50" class="title">ClimateOS HEAT–001｜A–C–B 动态接口（概念示意）</text><text x="45" y="80" class="sub">复用 #177 固定场景：A 余热源 → C 热泵 / 可选水罐 → B 单一季节聚合需求</text>
<rect x="80" y="270" width="220" height="160" rx="22" class="source"/><text x="190" y="310" text-anchor="middle" class="label">A｜合成余热源</text><text x="190" y="345" text-anchor="middle" class="small">稳定低/中温边界</text><text x="190" y="375" text-anchor="middle" class="small">可用热、T、ṁ、p</text><text x="190" y="405" text-anchor="middle" class="small">非真实工业数据</text>
<rect x="490" y="205" width="300" height="240" rx="24" class="plant"/><text x="640" y="245" text-anchor="middle" class="label">C｜热泵连接站</text><rect x="530" y="270" width="220" height="68" rx="12" fill="#fff" stroke="#4b83a7" stroke-width="2"/><text x="640" y="299" text-anchor="middle" class="label">热泵</text><text x="640" y="323" text-anchor="middle" class="small">源侧 ↔ 负荷侧；Q / W / 状态</text><rect x="530" y="355" width="220" height="62" rx="12" class="tank"/><text x="640" y="381" text-anchor="middle" class="label">可选水罐</text><text x="640" y="402" text-anchor="middle" class="small">连接侧/库存/损失待冻结</text>
<rect x="1000" y="270" width="220" height="160" rx="22" class="demand"/><text x="1110" y="310" text-anchor="middle" class="label">B｜聚合需求</text><text x="1110" y="345" text-anchor="middle" class="small">单一季节热负荷</text><text x="1110" y="375" text-anchor="middle" class="small">服务、欠供、回水</text><text x="1110" y="405" text-anchor="middle" class="small">匹配 R0/R1 服务</text>
<path d="M300 300 C355 215 420 215 490 300" class="supply"/><path d="M490 360 C420 455 360 455 300 390" class="ret"/><text x="395" y="180" text-anchor="middle" class="small">A–C 低温供水</text><text x="395" y="475" text-anchor="middle" class="small">A–C 低温回水｜L 80m / T 120m</text>
<path d="M790 300 C850 215 935 215 1000 300" class="supply"/><path d="M1000 390 C930 465 850 465 790 360" class="ret"/><text x="895" y="180" text-anchor="middle" class="small">C–B 高温供水</text><text x="895" y="475" text-anchor="middle" class="small">C–B 高温回水｜L 40m / T 180m</text>
<rect x="80" y="555" width="1140" height="132" rx="14" fill="#f2f5f7" stroke="#aab7c1"/><text x="105" y="590" class="label">每一对管段的动态状态</text><text x="105" y="620" class="small">质量流量 ṁ、绝压 p、流体 T/h、壁温/热容、摩阻与局部损失、ρgΔz、热输送时间 V/Q</text><text x="105" y="650" class="small">同一核算边界：A 可用/取热 → 热泵电功与热输出 ↔ 罐库存 → B 服务 + 网络损失；质量/能量必须守恒</text>
<line x1="80" y1="725" x2="140" y2="725" class="supply"/><text x="155" y="731" class="small">供水</text><line x1="245" y1="725" x2="305" y2="725" class="ret"/><text x="320" y="731" class="small">回水</text><text x="80" y="772" class="sub">L/T 路长与标高是继承的合成概念输入；无第三段 A–B 管、无真实坐标、无模拟结果。</text></svg>