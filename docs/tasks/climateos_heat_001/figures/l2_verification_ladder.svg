<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="670" viewBox="0 0 1250 670" role="img" aria-labelledby="title desc">
<title id="title">L2 验证阶梯</title><desc id="desc">未来L2从解析锚点进入守恒库存检查、时间和空间收敛、独立复核、可选且另行授权的现场留出验证，最后Founder验收。任何证据失败则停止排序结论。</desc>
<style>text{font-family:Arial,sans-serif;fill:#18334d}.title{font-size:29px;font-weight:bold}.sub{font-size:16px;fill:#586e80}.box{fill:#f2f8fc;stroke:#3c7095;stroke-width:2}.gate{fill:#fff3df;stroke:#b77a22;stroke-width:3}.stop{fill:#fff1ef;stroke:#b44b46;stroke-width:2}.head{font-size:19px;font-weight:bold}.body{font-size:14px}.arrow{stroke:#687f91;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#687f91"/></marker></defs><rect width="1250" height="670" fill="#fcfdff"/><text x="45" y="52" class="title">未来 L2 验证阶梯｜失败时停止排序结论</text><text x="45" y="82" class="sub">设计计划，不是已运行测试；现场验证需要独立数据授权和后续任务书。</text>
<rect x="55" y="145" width="260" height="125" rx="14" class="box"/><text x="75" y="180" class="head">1｜解析锚点</text><text x="75" y="210" class="body">静压、摩阻、K、V/Q</text><text x="75" y="235" class="body">热阻/热容参考算例</text>
<rect x="350" y="145" width="260" height="125" rx="14" class="box"/><text x="370" y="180" class="head">2｜守恒与库存</text><text x="370" y="210" class="body">节点质量、系统能量</text><text x="370" y="235" class="body">初末管/水/罐状态</text>
<rect x="645" y="145" width="260" height="125" rx="14" class="box"/><text x="665" y="180" class="head">3｜时间/空间收敛</text><text x="665" y="210" class="body">三档步长、离散与事件</text><text x="665" y="235" class="body">服务/压力/热损监视</text>
<rect x="940" y="145" width="260" height="125" rx="14" class="box"/><text x="960" y="180" class="head">4｜独立复核</text><text x="960" y="210" class="body">不同路径复算基准与 L/T</text><text x="960" y="235" class="body">输入/工具/结果可追溯</text>
<path d="M315 207 L350 207" class="arrow"/><path d="M610 207 L645 207" class="arrow"/><path d="M905 207 L940 207" class="arrow"/>
<rect x="275" y="365" width="330" height="125" rx="14" class="box"/><text x="300" y="400" class="head">5｜未来现场留出验证（另批）</text><text x="300" y="432" class="body">授权测量、校准、时间同步</text><text x="300" y="459" class="body">未触碰地点/时段独立评估</text>
<rect x="670" y="365" width="360" height="125" rx="14" class="gate"/><text x="695" y="400" class="head">6｜Founder 科学验收</text><text x="695" y="432" class="body">批准另开合成实现 / 补证 / 暂停</text><text x="695" y="459" class="body">每个后续阶段另行决定</text>
<rect x="1070" y="365" width="135" height="125" rx="14" class="stop"/><text x="1090" y="410" class="head">失败</text><text x="1090" y="442" class="body">停止排序</text><text x="1090" y="468" class="body">查因修复</text>
<path d="M1070 270 C1070 315 440 315 440 365" class="arrow"/><path d="M605 427 L670 427" class="arrow"/><path d="M1030 427 L1070 427" class="arrow"/>
<text x="55" y="555" class="sub">无现场数据时：只可报告合成情景内的模型确认，不能声称预测真实系统。</text><text x="55" y="585" class="sub">守恒、收敛、服务匹配或独立复核任何一项未通过 → 不给 L/T 推荐。</text></svg>